name: Deploy To Server

on:
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
             DOCKERHUB_USER: ${{vars.DOCKERHUB_USERNAME}}
             DOCKER_TAG: ${{ github.sha }}


        steps:
            - name: code checkout
              uses: actions/checkout@v6

            - name: commands
              run: |
                pwd 
                ls -lrth


            - name: SSH to server
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                key: ${{ secrets.KEY }}
                script: |
                    docker ps

            - name: Copy docker compose file
              if: success()
              uses: appleboy/scp-action@v1
              with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                key: ${{ secrets.KEY }}
                source: "docker-compose.yml"
                target: /home/ubuntu/github-actions

            - name: SSH to server
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                key: ${{ secrets.KEY }}
                script: |
                    echo "Running!!!!!!!!!!!!!!!!!!!!!"
                    export DOCKERHUB_USER=${{ vars.DOCKERHUB_USERNAME }}
                    export DOCKER_TAG=${{ github.sha }}
                    echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login --username ${{ vars.DOCKERHUB_USERNAME }} --password-stdin
                    cd ~/github-actions && docker compose up --build -d


