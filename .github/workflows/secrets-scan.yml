name: secrets-scanning

on:
    workflow_dispatch

jobs:
    secrets-scan:

        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                fetch-depth: 0

            - name: git leaks scanning
              uses: gitleaks/gitleaks-action@v3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}