  #     - ~/.kube/config:/root/.kube/config:ro
  #   restart: unless-stopped
    # Optional: expose a port if you want to expose the CLI over HTTP
    # ports:
    #   - "9000:9000"
    # depends_on:
    #   - bankapp
    #   - mysql

volumes:
  mydata:
  ollama_data:

networks:
  bankapp:
    driver: bridge
