apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: copilot-role
  namespace: bankapp
rules:
- apiGroups: ["" ]
  resources: ["pods", "pods/log", "events", "services", "endpoints", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
